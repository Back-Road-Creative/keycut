name: Release

# Pushing a v* tag builds the Windows installer and attaches it to that tag's
# GitHub release, creating the release if it does not exist yet.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create / upload

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take the version from the tag
        run: |
          "VERSION=$($env:GITHUB_REF_NAME -replace '^v', '')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Refuse a tag that disagrees with pyproject.toml
        # Otherwise the installer would announce a version the packaged code
        # does not claim, and Add/Remove Programs would carry that number for
        # as long as it stays installed.
        run: |
          $packaged = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($packaged -ne $env:VERSION) {
            throw "tag $env:GITHUB_REF_NAME means version $env:VERSION, pyproject.toml says $packaged"
          }

      - name: Install keycut and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build the one-file executable
        # keycut's entry point is a module function, so PyInstaller is aimed at
        # installer/keycut_launcher.py. Capital PyInstaller is load-bearing:
        # `python -m pyinstaller` is not a module and fails.
        run: python -m PyInstaller --onefile --console --name keycut installer/keycut_launcher.py

      - name: Smoke-test the frozen executable
        run: dist\keycut.exe --help

      - name: Install Inno Setup
        # Installed, not assumed: a runner image that quietly drops a
        # preinstalled tool would break releases with no warning.
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc - Inno Setup's install layout changed" }
          & $iscc /DAppVersion=$env:VERSION installer\keycut.iss

      - name: Attach the installer to the release
        # gh ships on the runner, so this needs no third-party action to pin,
        # audit and keep current — softprops/action-gh-release would buy only
        # the create-if-missing branch written out below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = "dist\keycut-setup-$env:VERSION.exe"
          gh release view $env:GITHUB_REF_NAME --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes $exe
          }
          if ($LASTEXITCODE -ne 0) { throw "could not publish $exe to $env:GITHUB_REF_NAME" }
