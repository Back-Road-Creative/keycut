[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keycut"
version = "0.1.0"
description = "Lossless multi-range video extraction with ffmpeg stream copy, without the GOP-replay artefact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "joepetjr@gmail.com" }]
keywords = ["ffmpeg", "video", "stream-copy", "keyframe", "gop", "concat", "lossless", "trim"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
keycut = "keycut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keycut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
